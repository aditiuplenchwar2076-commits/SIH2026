# Fortinet FortiOS Configuration - Hardened & Secure Sample
# Device: Perimeter Firewall
config system global
    set hostname "FortiGate-Secure-GW"
    set admin-sport 443
    set admin-https-redirect enable
    set admin-lockout-threshold 3
    set admin-lockout-duration 60
end

config system interface
    edit "port1"
        set allowaccess ping https ssh
    next
end

config system ssh
    set ssh-v1 disable
    set admin-login disable
    set ssh-root-login deny
end

config log syslogd setting
    set status enable
    set server "192.168.10.50"
end

config system ntp
    set status enable
    config ntpserver
        edit 1
            set server "192.168.10.1"
        next
    end
end

config system snmp community
    edit 1
        set name "corp_sec_snmp"
        set status enable
    next
end

config user radius
    edit "corp_radius"
        set server "192.168.10.20"
        set secret "ENC 9F2A83BC410D"
    next
end

config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 12
end

config system admin
    edit "admin"
        set password "ENC 7A8B9C0D1E2F3G4H5I6J"
    next
end
