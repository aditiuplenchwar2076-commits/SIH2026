# Juniper Junos Configuration - Vulnerable Sample
# Device: Edge Router
set system host-name Juniper-Core-Edge

## Insecure Remote Management Protocols
set system services telnet
set system services ssh protocol-version v1
set system services ssh root-login allow
set system services web-management http

## Insecure Legacy Services
set system services ftp
set system services finger

## Insecure SNMP Community
set snmp community public authorization read-only

## Weak Plain-Text Authentication
set system root-authentication plain-text-password-value admin123

## Missing Controls:
## - No centralized syslog host configured
## - No NTP time synchronization configured
## - No centralized AAA (RADIUS/TACACS+) configured
## - No login protection (retry-options / lockout) configured
