hostname Secure-Router

!
! Secure remote access using SSH
!
line vty 0 4
 transport input ssh

!
! Strong authentication
!
enable secret StrongSecurePassword123

!
! AAA authentication
!
aaa new-model

!
! Centralized logging
!
logging 192.168.1.10

!
! Network Time Protocol
!
ntp server 192.168.1.20

!
! Login protection
!
login block-for 60 attempts 3 within 60

!
! Secure interface configuration
!
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown

!
! HTTP management is disabled
! Telnet is disabled
! SNMP public community is not used
!