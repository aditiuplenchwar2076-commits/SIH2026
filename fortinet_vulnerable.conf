# Fortinet FortiOS Configuration - Vulnerable Sample
# Device: Perimeter Firewall
config system global
    set hostname "FortiGate-Core-Edge"
    set admin-lockout-threshold 0
end

config system interface
    edit "port1"
        set allowaccess ping http telnet ssh
    next
end

config system ssh
    set ssh-v1 enable
    set admin-login enable
end

config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end

config system admin
    edit "admin"
        set password "admin123"
    next
end

config system password-policy
    set status disable
end

# Missing Controls:
# - No centralized syslog server configured
# - No NTP server configured
# - No centralized AAA (RADIUS/TACACS+) configured
# - Login lockout is disabled (threshold 0)
# - Telnet, plain HTTP, SSHv1, and direct admin login are enabled
