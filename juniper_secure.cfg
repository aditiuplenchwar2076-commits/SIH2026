# Juniper Junos Configuration - Hardened & Secure Sample
# Device: Security Gateway
set system host-name Juniper-Secure-GW

## Secure Remote Management
set system services ssh protocol-version v2
set system services ssh root-login deny
set system services web-management https
set system services web-management http disable
set system services telnet disable

## Centralized Syslog Logging
set system syslog host 192.168.10.50 any notice
set system syslog host 192.168.10.50 authorization info

## Secure Network Time Protocol
set system ntp server 192.168.10.1 prefer
set system ntp server 192.168.10.2

## Secure SNMP (Custom Community String)
set snmp community corp_sec_mon authorization read-only

## Centralized AAA Authentication (RADIUS)
set system authentication-order radius
set system radius-server 192.168.10.20 secret "$9$kFnsd24jksdf834jsd"

## Login Protection & Brute Force Prevention
set system login retry-options tries-before-disconnect 3
set system login retry-options backoff-threshold 2
set system login retry-options backoff-factor 5
set system login retry-options lockout-period 15
set system login password minimum-length 12

## Strong Encrypted Password
set system root-authentication encrypted-password "$6$rounds=65600$saltValue$encryptedHashOutput..."
